# ═══════════════════════════════════════════════════════════════
#  NDËRTIMI I .ipa-së TE NJË MAC NË RE (Codemagic)
# ═══════════════════════════════════════════════════════════════
#
# Pse ekziston ky skedar: `.ipa`-ja prodhohet vetëm te macOS, dhe projekti
# punohet nga Windows. Codemagic e merr kodin nga GitHub-i, e ndërton te një
# Mac i tyre dhe e dërgon drejt te App Store Connect. Asnjë Mac nuk blihet.
#
# ⚠️  NUK NDËRTON DOT PA LLOGARINË APPLE. Nënshkrimi kërkon një certifikatë që
#     e lëshon Apple; pa Apple Developer Program (99 USD/vit) ky skedar nuk
#     prodhon asgjë. Kjo nuk kapërcehet me asnjë cilësim.
#
# ⚠️  ASNJË FJALËKALIM NUK SHKRUHET KËTU. Depoja është publike. Çelësi i App
#     Store Connect-it vendoset VETËM te Codemagic → Teams → Integrations →
#     App Store Connect, me emrin `ndiej`. Ky skedar e thërret me emër.
#
# Përgatitja, një herë:
#   1. codemagic.io → hyr me GitHub → zgjidh depon `artegogoapp.com`
#   2. App Store Connect → Users and Access → Integrations → App Store Connect
#      API → krijo një çelës (Admin ose App Manager) dhe shkarko `.p8`
#   3. Codemagic → Integrations → App Store Connect → ngarko `.p8`-në,
#      Issuer ID dhe Key ID → emërtoje `ndiej`
#   4. Krijo aplikacionin te App Store Connect me `com.drartegogo.artegogo`
#   5. Shtyp «Start new build»

workflows:
  ios:
    name: NDIEJ — iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: ndiej

    environment:
      # Çelësi privat i certifikatës — `CERTIFICATE_PRIVATE_KEY`, i ruajtur si i
      # sigurt te Codemagic. Pa grupin e emëruar këtu, variabla nuk arrin dot
      # te ndërtimi edhe pse ekziston te paneli.
      groups:
        - appstore
      # ⚠️  22, JO 20. Capacitor 8 e refuzon Node-in nën 22 me
      #     «The Capacitor CLI requires NodeJS >=22.0.0» dhe ndërtimi bie te
      #     `cap sync`, pasi faqja është ndërtuar tashmë — pra duket sikur
      #     dështoi vetë ndërtimi i faqes.
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "com.drartegogo.artegogo"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Varësitë
        script: npm ci

      # Lexon `.env.ios` dhe bën `cap sync ios`. Pa të, brenda app-it do të
      # shkonte ndërtimi i webit, që e thërret API-në me rrugë relative.
      - name: Faqja dhe sinkronizimi
        script: npm run build:ios

      # ⚠️  `--project` DUHET I DHËNË ME DORË.
      #
      #     Pa të, `use-profiles` kërkon `**/*.xcodeproj` nga rrënja e depos —
      #     dhe te një projekt Capacitor ajo kërkesë e gjen edhe projektin te
      #     `node_modules`, ndaj profili nuk i ngjitet gjithmonë atij të
      #     duhurit. Pasoja ishte «App requires a provisioning profile» te
      #     arkivimi, me hapin e certifikatave të kaluar me jeshile.
      - name: Certifikatat dhe profilet
        script: |
          keychain initialize
          # ⚠️  `--certificate-key` DUHET, EDHE PSE DUKET I TEPERT.
          #
          #     Pa të, komanda e gjen certifikatën te llogaria e Apple-it por
          #     nuk e ruan dot: «Cannot save Signing Certificates without
          #     certificate private key». Pastaj vazhdon pa gabim, me listë
          #     bosh profilesh — dhe dështimi del tri hapa më vonë, te
          #     arkivimi, ku duket sikur fajin e ka projekti.
          #
          #     Çelësi është i të njejtit njeri që e krijoi certifikatën. Apple
          #     lejon vetëm dy certifikata shpërndarjeje; ky çelës ruhet e
          #     ripërdoret, nuk krijohet një i ri me çdo ndërtim.
          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"             --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
          # Që herën tjetër regjistri ta thotë vetë nëse profili u ngjit.
          echo "— cilësimet e nënshkrimit —"
          grep -nE "CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM"             "$XCODE_PROJECT/project.pbxproj" || echo "ASNJË — profili nuk u ngjit"

      # Apple nuk e pranon dy herë të njëjtin numër ndërtimi — si Play-i.
      # `BUILD_NUMBER` e jep vetë Codemagic dhe rritet me çdo ndërtim, ndaj
      # nuk ka si të përsëritet. Numri i versionit që sheh njeriu
      # (`MARKETING_VERSION`) nuk preket: ai rri te projekti.
      - name: Numri i ndërtimit
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Arkivimi
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Shkon te TestFlight, jo te dyqani. Shqyrtimi i Apple-it kërkohet
        # veçmas, me dorë — pra një ndërtim i gabuar nuk del kurrë publik.
        submit_to_testflight: true
