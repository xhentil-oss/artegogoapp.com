<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover: faqja shtrihet nën notch, dhe `env(safe-area-inset-*)`
         bëhet i përdorshëm. interactive-widget: tastiera zvogëlon përmbajtjen
         në vend që të shtypë layout-in. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>Arte Gogo — Meditim · Transformim</title>
    <meta name="description" content="Meditime të udhëhequra, frymëmarrje dhe praktika somatike në shqip." />

    <!-- Tipografia sipas specifikimit të klientes (16 shtator 2026):
         · Sans  — system-ui për gjithë ndërfaqen
         · Serif — Georgia vetëm për momentet e veçanta

         Të dy janë fonte SISTEMI, ndaj këtu nuk ngarkohet asgjë. Më parë
         rrinin Poppins dhe Playfair Display nga Google Fonts — dy lidhje
         `preconnect` plus një fletë stili para render-it të parë. Emrat e
         fonteve rrinë vetëm te `theme/tokens.js`. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ngjyra e shiritit të browser-it -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E12" media="(prefers-color-scheme: dark)" />

    <!-- "Shto në ekranin bazë" në iOS: pa shirit browser-i, statusi i lexueshëm -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Arte Gogo" />

    <!-- numrat e telefonit të mos kthehen në lidhje nga Safari -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <!--
      Splash-i brenda `#root`.

      ⚠️  Pa të, koha midis ngarkimit të HTML-së dhe render-it të parë të
          React-it është faqe KREJT E BARDHË. Në telefon mbi rrjet të dobët
          ajo zgjat sa shkarkohet e analizohet paketa, dhe një ekran i bardhë
          lexohet si aplikacion i prishur — jo si pritje.

          React-i i heq vetë fëmijët e `#root` te render-i i parë, ndaj nuk
          duhet asnjë kod për ta fshirë. I gjithë stili rri inline me qëllim:
          një fletë e jashtme do të ishte një kërkesë më shumë pikërisht në
          çastin që duam të shkurtojmë.
    -->
    <div id="root">
      <div
        id="ag-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fff;
        "
      >
        <img
          src="/transparent-logo-2.png"
          alt="Arte Gogo"
          width="132"
          height="132"
          style="width: 132px; height: auto; opacity: 0.9; animation: ag-splash 1.6s ease-in-out infinite"
        />
      </div>
    </div>
    <style>
      @keyframes ag-splash {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.9; }
      }
      /* Vetëm splash-i: `#root > div` do të prekte edhe rrënjën e vërtetë të
         aplikacionit pasi React-i vizaton, dhe do t'i ngjyrosnte sfondin. */
      @media (prefers-color-scheme: dark) {
        #ag-splash { background: #0e0e12; }
      }
      @media (prefers-reduced-motion: reduce) {
        #ag-splash img { animation: none; }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
