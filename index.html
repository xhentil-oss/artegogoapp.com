<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover: faqja shtrihet nën notch, dhe `env(safe-area-inset-*)`
         bëhet i përdorshëm. interactive-widget: tastiera zvogëlon përmbajtjen
         në vend që të shtypë layout-in. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>Arte Gogo — Meditim · Transformim</title>
    <meta name="description" content="Meditime të udhëhequra, frymëmarrje dhe praktika somatike në shqip." />

    <!-- Tipografia sipas specifikimit:
         · Poppins (sans geometrik) për ndërfaqen e përgjithshme
         · Playfair Display (serif) për tituj hero dhe momente të veçanta
         Të dy kanë fallback sistemi te `theme/tokens.js`, ndaj pamja mbetet
         e qëndrueshme edhe pa rrjet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ngjyra e shiritit të browser-it -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E12" media="(prefers-color-scheme: dark)" />

    <!-- "Shto në ekranin bazë" në iOS: pa shirit browser-i, statusi i lexueshëm -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Arte Gogo" />

    <!-- numrat e telefonit të mos kthehen në lidhje nga Safari -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <!--
      Splash-i brenda `#root`.

      ⚠️  Pa të, koha midis ngarkimit të HTML-së dhe render-it të parë të
          React-it është faqe KREJT E BARDHË. Në telefon mbi rrjet të dobët
          ajo zgjat sa shkarkohet e analizohet paketa, dhe një ekran i bardhë
          lexohet si aplikacion i prishur — jo si pritje.

          React-i i heq vetë fëmijët e `#root` te render-i i parë, ndaj nuk
          duhet asnjë kod për ta fshirë. I gjithë stili rri inline me qëllim:
          një fletë e jashtme do të ishte një kërkesë më shumë pikërisht në
          çastin që duam të shkurtojmë.
    -->
    <div id="root">
      <div
        id="ag-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fff;
        "
      >
        <img
          src="/transparent-logo-2.png"
          alt="Arte Gogo"
          width="132"
          height="132"
          style="width: 132px; height: auto; opacity: 0.9; animation: ag-splash 1.6s ease-in-out infinite"
        />
      </div>
    </div>
    <style>
      @keyframes ag-splash {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.9; }
      }
      /* Vetëm splash-i: `#root > div` do të prekte edhe rrënjën e vërtetë të
         aplikacionit pasi React-i vizaton, dhe do t'i ngjyrosnte sfondin. */
      @media (prefers-color-scheme: dark) {
        #ag-splash { background: #0e0e12; }
      }
      @media (prefers-reduced-motion: reduce) {
        #ag-splash img { animation: none; }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
